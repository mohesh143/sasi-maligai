<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<title>Contact - Sasi Maligai</title>
</head>
<body>
<header id="site-header"></header>
<main>
  <section>
    <div class="container">
      <h1 class="page-title t-page">Contact us</h1>
      <p id="noDetails" class="alert alert-info" hidden>The shop owner has not added contact details yet.</p>
      <div class="info-grid">
        <div class="info-card">
          <div data-need="phone"><h3>Phone</h3><p><a id="phoneLink" href="#"></a></p></div>
          <div data-need="whatsappUrl"><h3>WhatsApp</h3><p><a class="btn btn-whatsapp btn-small" data-href="whatsappUrl" href="#" target="_blank" rel="noopener">Message on WhatsApp</a></p></div>
          <div data-need="email"><h3>Email</h3><p><a id="emailLink" href="#"></a></p></div>
        </div>
        <div class="info-card">
          <div data-need="address"><h3>Address</h3><p id="addressText" class="pre-line"></p>
            <p><a class="btn btn-outline btn-small" data-href="mapsUrl" href="#" target="_blank" rel="noopener">Open in Google Maps</a></p></div>
          <div data-need="openingHours"><h3>Opening hours</h3><p id="hoursText" class="pre-line mb-0"></p></div>
        </div>
      </div>
      <iframe id="mapFrame" class="map-frame mt-14" title="Map showing the shop" loading="lazy" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
    </div>
  </section>

  <section class="band">
    <div class="container">
      <h2>Share your feedback</h2>
      <div class="form-card">
        <div id="feedbackAlert"></div>
        <form id="feedbackForm" novalidate>
          <div class="form-group">
            <label for="fbName">Your name</label>
            <input type="text" id="fbName" name="name" maxlength="100" required autocomplete="name">
          </div>
          <div class="form-group">
            <span class="label" id="ratingLabel">Rating</span>
            <div class="star-rating" id="starRating" role="group" aria-labelledby="ratingLabel">
              <button type="button" data-value="1" aria-label="1 star">&#9733;</button>
              <button type="button" data-value="2" aria-label="2 stars">&#9733;</button>
              <button type="button" data-value="3" aria-label="3 stars">&#9733;</button>
              <button type="button" data-value="4" aria-label="4 stars">&#9733;</button>
              <button type="button" data-value="5" aria-label="5 stars">&#9733;</button>
            </div>
            <input type="hidden" id="fbRating" value="0">
          </div>
          <div class="form-group">
            <label for="fbMessage">Your feedback</label>
            <textarea id="fbMessage" name="message" maxlength="1000" required></textarea>
          </div>
          <div class="trap" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
          <button type="submit" class="btn btn-block">Send feedback</button>
        </form>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="js/common.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
